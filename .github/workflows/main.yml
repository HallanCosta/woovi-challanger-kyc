name: 🚀 Deploy to Production

on:
  workflow_dispatch:
  # push:
   # branches:
   #  - main

jobs:
  build:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        run: npm install -g pnpm@10.0.0

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 👷 Build project
        run: |
          pnpm build &&
          pnpm build:storybook

      - name: 🚢 Deploy to Production server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          ARGS: '-rlgoDzvc -i'
          SOURCE: '.'
          REMOTE_HOST: ${{ secrets.PRODUCTION_HOST }}
          REMOTE_USER: ${{ secrets.PRODUCTION_SUDO_USERNAME }}
          EXCLUDE: '/screenshots/, /.storybook/, /coverage/, vite.config.ts, vitest.config.ts'
          TARGET: ${{ secrets.PRODUCTION_PROJECT_DIR }}

  deploy:
      name: 🚀 Restart Services
      runs-on: ubuntu-latest
      needs: build

      steps:
        - name: 🏁 Reload Production Services
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.PRODUCTION_HOST }}
            username: ${{ secrets.PRODUCTION_SUDO_USERNAME }}
            key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
            script: |
              cd ${{ secrets.PRODUCTION_PROJECT_DIR }}
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm use 24
              echo "Stopping production servers..."
              pnpm stop:production
              echo "Starting production servers..."
              pnpm start:production
